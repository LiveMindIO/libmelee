name: Linux tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: livemindio-docker
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          github-server-url: https://git.jacoby6000.com

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install libmelee and run tests
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv
          uv pip install --python .venv/bin/python .
          .venv/bin/python test.py
